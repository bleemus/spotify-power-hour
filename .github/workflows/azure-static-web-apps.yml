name: Deploy to Azure Static Web Apps

# PR opened/updated  -> test, build, deploy to that PR's own preview environment
# PR closed/merged   -> delete that PR's preview environment
# push to main       -> test, build, deploy to production (a merged PR lands here)
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write # the deploy action comments the preview URL on the PR

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - run: npm run build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          # Production origin whose /callback is registered with Spotify; previews sign in through it.
          VITE_AUTH_REDIRECT_ORIGIN: ${{ vars.VITE_AUTH_REDIRECT_ORIGIN }}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist

      # On pull_request events this deploys to a staging environment named after the PR;
      # on push to main it deploys to production.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete this PR's preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ''
