name: Deploy to Azure Static Web Apps

# PR opened/updated -> test, build, deploy to the single long-lived "preview" environment
#                      (the most recently pushed PR owns it; it is never deleted)
# push to main      -> test, build, deploy to production (a merged PR lands here)
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write # the deploy action comments the preview URL on the PR

# One queue for all PRs (they share the preview slot) and one for main.
concurrency:
  group: swa-${{ github.event_name == 'pull_request' && 'preview' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - run: npm run build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          # Origin whose /callback is registered with Spotify. The preview slot has a stable
          # hostname, so it is registered directly and signs in on its own origin.
          VITE_AUTH_REDIRECT_ORIGIN: ${{ github.event_name == 'pull_request' && vars.VITE_PREVIEW_ORIGIN || vars.VITE_AUTH_REDIRECT_ORIGIN }}
          # SWA default hostname; preview hosts are derived from it when the auth origin is a custom domain.
          VITE_SWA_DEFAULT_HOST: ${{ vars.VITE_SWA_DEFAULT_HOST }}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist

      - name: Deploy to production
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true

      # All PRs share the named environment "preview" (<name>-preview.<region>.<n>.azurestaticapps.net).
      # deployment_environment is a documented input missing from the action's manifest,
      # so GitHub warns about it; the action still reads it.
      - name: Deploy to the preview environment
        if: github.event_name == 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          deployment_environment: preview
